<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RE: in CARNATION</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #0d0b14; color: #c8c6d6; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  canvas { image-rendering: pixelated; display: block; touch-action: none; }
  #pad { display: none; }
  body { touch-action: none; overscroll-behavior: none; }
  #keys { color: #9a98b0; }
  #keys b { color: #ffe066; font-weight: 600; }
  #keys a { color: #6a6880; margin-left: 10px; }
  #keys label { color: #6a6880; margin-left: 10px; }
  #keys select { background: #1c1a26; color: #9a98b0; border: 1px solid #3a3850; font: inherit; }
  #devClose { display: none; }
  /* スマホのデバッグの並び（板の「デバッグ」で開く）: 画面の上に重ねる。指で押しやすい大きさに */
  #keys.touch { position: fixed; left: 0; right: 0; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 10px 14px; padding: 10px; background: rgba(13, 11, 20, 0.92); font-size: 15px; touch-action: auto; }
  #keys.touch a, #keys.touch label { margin-left: 0; padding: 4px 2px; }
  #keys.touch select { font-size: 15px; padding: 4px; }
  #keys.touch #devClose { display: inline; color: #ffe066; }
</style>
</head>
<body>
<div id="game">
  <div id="keys"></div>
  <canvas id="c" width="320" height="240"></canvas>
</div>
<canvas id="pad" aria-hidden="true"></canvas>
<script type="module" src="/src/main.js"></script>
</body>
</html>
